services:
  - type: web
    name: ktaab-diagnostics
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: ktaab-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
